services:
  # Backend - FastAPI Python web service
  - type: web
    name: orglens-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ALLOW_ALL
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"

  # Frontend - Static site (Vite build)
  - type: web
    name: orglens
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
